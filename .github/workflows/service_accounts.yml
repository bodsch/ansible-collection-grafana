---

name: service_accounts

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "branch to test"
        required: false

  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - '!doc/**'
    paths:
      - "plugins/**"
      - 'roles/service_accounts/**'
      - '.github/workflows/service_accounts.yml'
      - "!Makefile"
      - "!README.md"

  pull_request:
    branches:
      - 'main'
      - 'feature/**'
      - 'fix/**'
      - '!doc/**'
    paths:
      - "plugins/**"
      - 'roles/service_accounts/**'
      - '.github/workflows/service_accounts.yml'
      - "!Makefile"
      - "!README.md"

concurrency:
  group: service_accounts-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  COLLECTION_NAMESPACE: bodsch
  COLLECTION_NAME: grafana
  PY_COLORS: '1'
  ANSIBLE_FORCE_COLOR: '1'

jobs:
  debian:
    name: "${{ matrix.image }} / ${{ matrix.scenario }} / ${{ matrix.ansible-version }} / ${{ matrix.python_version }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:13
        ansible-version:
          - '13.0'
        python_version:
          - '3.12'
        scenario:
          - default
        collection_role:
          - service_accounts

    steps:
      - name: check out the codebase.
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || github.event.pull_request.head.sha || github.sha }}

      - name: 🐍 set up python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ matrix.python_version }}"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: force reinstall of community.docker
        run: |
          mkdir -p /home/runner/.ansible/collections
          ansible-galaxy collection install community.docker --force

      - name: Install collection
        run: |
          make \
            install

      - name: test ${{ matrix.collection_role }} - ${{ matrix.scenario }}
        run: |
          make \
            test \
              -e TOX_ANSIBLE="ansible_${{ matrix.ansible-version }}" \
              -e DISTRIBUTION="${{ matrix.image }}" \
              -e COLLECTION_ROLE="${{ matrix.collection_role }}" \
              -e COLLECTION_SCENARIO="${{ matrix.scenario }}"

  scenarios:
    name: "${{ matrix.image }} / ${{ matrix.scenario }} / ${{ matrix.ansible-version }} / ${{ matrix.python_version }}"
    runs-on: ubuntu-22.04
    needs:
      - debian
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:13
        ansible-version:
          - '13.0'
        python_version:
          - '3.12'
        scenario:
          - configured
        collection_role:
          - service_accounts

    steps:
      - name: check out the codebase.
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.branch || github.event.pull_request.head.sha || github.sha }}

      - name: 🐍 set up python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "${{ matrix.python_version }}"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test-requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-dateutil

      - name: force reinstall of community.docker
        run: |
          mkdir -p /home/runner/.ansible/collections
          ansible-galaxy collection install community.docker --force

      - name: Install collection
        run: |
          make \
            install

      - name: test ${{ matrix.collection_role }} - ${{ matrix.scenario }}
        run: |
          make \
            test \
              -e TOX_ANSIBLE="ansible_${{ matrix.ansible-version }}" \
              -e DISTRIBUTION="${{ matrix.image }}" \
              -e COLLECTION_ROLE="${{ matrix.collection_role }}" \
              -e COLLECTION_SCENARIO="${{ matrix.scenario }}"
