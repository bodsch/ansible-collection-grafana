---

- name: include OS specific configuration ({{ ansible_facts.distribution }} ({{ ansible_facts.os_family }}) {{ ansible_facts.distribution_major_version }})
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      paths:
        - "vars"
      files:
        # eg. debian-10 / ubuntu-20.04 / centos-8 / oraclelinux-8
        - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_major_version }}.yml"
        # eg. archlinux-systemd / archlinux-openrc
        - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.service_mgr | lower }}.yml"
        # eg. debian / ubuntu / centos / oraclelinux
        - "{{ ansible_facts.distribution | lower }}.yml"
        # eg. redhat / debian / archlinux
        - "{{ ansible_facts.os_family | lower }}.yml"
        # artixlinux
        - "{{ ansible_facts.os_family | lower | replace(' ', '') }}.yml"
        - default.yaml
      skip: true

- name: detect ansible check_mode
  bodsch.core.check_mode:
  register: _check_mode

- name: define running_in_check_mode
  ansible.builtin.set_fact:
    running_in_check_mode: '{{ _check_mode.check_mode }}'

- name: install dependency
  when:
    - not running_in_check_mode
    - grafana_requirements | default([]) | count > 0
  ansible.builtin.package:
    name: "{{ grafana_requirements }}"
    state: present

- name: validate datasource types
  ansible.builtin.set_fact:
    valid_datasources: "{{ grafana_datasources | bodsch.grafana.validate_datasource_type() }}"

- name: Fails if unsupported data sources have been configured
  when:
    - not running_in_check_mode
    - valid_datasources is defined
    - not valid_datasources.valid
  ansible.builtin.fail:
    msg: "{{ valid_datasources.msg }}"

- name: merge grafana configuration between defaults and custom
  ansible.builtin.set_fact:
    grafana_config_paths: "{{ grafana_defaults_config_paths | combine(grafana_config_paths, recursive=True) }}"

...
