---

- name: daemon-reload
  when:
    - ansible_facts.service_mgr | lower == "systemd"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true

- name: validate grafana config  # noqa no-changed-when
  ansible.builtin.command: /bin/true

- name: restart grafana
  when:
    - not running_in_check_mode
    - grafana_system_service.state | default('started') == 'started'
  become: true
  ansible.builtin.service:
    name: grafana-server
    state: restarted
  notify:
    - wait for grafana

- name: wait for grafana
  when:
    - not running_in_check_mode
  ansible.builtin.wait_for:
    path: "{{ grafana_pidfile }}"
    state: present
    delay: 4
    msg: "Timeout to find {{ grafana_pidfile }}"
  ignore_errors: false

- name: list service accounts files
  run_once: true
  ansible.builtin.debug:
    msg: "{{ found_sa_keyfiles.files | bodsch.grafana.file_list }}"
  when:
    - found_sa_keyfiles is defined
    - found_sa_keyfiles.files is defined

...
