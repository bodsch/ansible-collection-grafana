---

grafana_provisioning:
  # Should we use the provisioning capability when possible
  # (provisioning require grafana >= 5.0)
  enabled: false

grafana_datasources:
  prometheus:
    # state: absent
    datasource:
      type: "prometheus"
      # access: "proxy"
      url: "http://prometheus.mydomain"
    # basic_auth:
    #   # Auth: true
    #   username: "admin"
    #   password: "password"
    default: true
    # json_data:
    #   tlsAuth: false
    #   tlsAuthWithCACert: false
    #   tlsSkipVerify: true

  prometheus_2:
    # state: absent
    datasource:
      type: "prometheus"
      # access: "proxy"
      url: "http://prometheus2.mydomain"

  loki:
    datasource:
      type: "loki"
      url: "http://loki.mydomain"
    editable: true

...
