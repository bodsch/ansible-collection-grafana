---

- name: install grafana plugins
  when:
    - grafana_plugins | default([]) | count > 0
  become_user: "{{ grafana_system_user.owner | default('grafana') }}"
  become: true
  bodsch.grafana.grafana_plugins:
    command: install
    plugins_dir: "{{ grafana_data_dir }}/plugins"
    install_dir: "{{ grafana_local_fact.install_path | default('/opt/grafana/' ~ grafana_local_fact.version.full_version) }}"
    plugins: "{{ grafana_plugins }}"
  register: grafana_install_plugins
  notify:
    - restart grafana
    - information about grafana plugins

...
